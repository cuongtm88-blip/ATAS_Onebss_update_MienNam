name: Release ATS OneBSS Miền Nam

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build app
        shell: pwsh
        run: ./scripts/build_app.ps1
      - name: Package app
        shell: pwsh
        run: |
          $version = uv run python -c "from ats_onebss import __version__; print(__version__)"
          Compress-Archive -Path "dist/ATS-OneBSS" -DestinationPath "dist/ATS-OneBSS-Windows-x64-$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/ATS-OneBSS-Windows-x64-*.zip
